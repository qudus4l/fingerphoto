<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fingerphoto Capture</title>
<style>
  :root{
    --bg:#0d1013; --panel:#161b21; --line:#232b34; --text:#e8edf2;
    --muted:#8b97a5; --ok:#3ddc97; --bad:#ef5f6b; --accent:#5aa9ff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       -webkit-font-smoothing:antialiased;
       display:flex;flex-direction:column;
       padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
       overflow:hidden}
  .row{display:flex;gap:8px;padding-top:10px;flex:0 0 auto}
  input{flex:1;min-width:0;padding:9px 10px;border-radius:8px;
        border:1px solid var(--line);background:var(--panel);color:var(--text);
        font-size:15px}
  input.missing{border-color:var(--bad)}
  #stage{position:relative;background:#000;border-radius:12px;overflow:hidden;
         border:1px solid var(--line);margin:10px auto 0;flex:0 0 auto}
  video{display:block;width:100%;height:100%;object-fit:cover}
  #overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .checks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
          margin-top:10px;flex:0 0 auto}
  .check{background:var(--panel);border:1px solid var(--line);border-radius:9px;
         padding:7px 9px}
  .check .label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;
                color:var(--muted)}
  .check .val{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
  .check.pass{border-color:rgba(61,220,151,.5)} .check.pass .val{color:var(--ok)}
  .check.fail .val{color:var(--bad)}
  #status{margin-top:9px;padding:9px 11px;border-radius:9px;background:var(--panel);
          border:1px solid var(--line);font-size:14px;min-height:40px;
          display:flex;align-items:center;flex:1 1 auto;overflow-y:auto;
          white-space:pre-wrap;color:var(--muted)}
  #status.err{border-color:var(--bad);color:#ffc4c9}
  #status.good{border-color:rgba(61,220,151,.5);color:var(--ok)}
  .actions{padding:9px 0 4px;flex:0 0 auto}
  button{width:100%;padding:14px;border-radius:10px;border:0;font-size:17px;
         font-weight:600;background:var(--accent);color:#08131f}
  button:disabled{background:#26303b;color:#5d6875}
  button.secondary{background:transparent;color:var(--muted);
                   border:1px solid var(--line);margin-top:7px;font-size:14px;
                   font-weight:500;padding:10px}
  #meta{font-size:11px;color:#5d6875;text-align:center;padding-bottom:6px;
        flex:0 0 auto;font-family:ui-monospace,Menlo,monospace}
  .modes{display:flex;gap:6px;padding-top:10px;flex:0 0 auto}
  .mode{flex:1;padding:9px;border-radius:8px;font-size:15px;font-weight:600;
        background:var(--panel);color:var(--muted);border:1px solid var(--line)}
  .mode.on{background:var(--accent);color:#08131f;border-color:var(--accent)}
  #result{font-size:15px}
  #result .big{font-size:26px;font-weight:700;letter-spacing:-.02em;
               display:block;margin-bottom:2px}
  #result .sub{font-size:13px;color:var(--muted);display:block}
</style>
</head>
<body>
  <div class="modes">
    <button class="mode on" data-mode="enroll">Enroll</button>
    <button class="mode" data-mode="identify">Identify</button>
    <button class="mode" id="lens" title="Switch camera">Lens ▸</button>
  </div>
  <div class="row">
    <input id="name" placeholder="Name" autocomplete="off" autocapitalize="words">
    <input id="key" placeholder="API key" type="password" autocomplete="off"
           style="flex:0 0 42%">
  </div>

  <div id="stage">
    <video id="v" playsinline muted autoplay></video>
    <svg id="overlay" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs><mask id="cut">
        <rect width="100" height="100" fill="#fff"/>
        <path id="silh-mask" fill="#000"/>
      </mask></defs>
      <rect width="100" height="100" fill="rgba(0,0,0,.5)" mask="url(#cut)"/>
      <path id="silh" fill="none" stroke="#5aa9ff" stroke-width="2.5"
            vector-effect="non-scaling-stroke"/>
    </svg>
  </div>

  <div class="checks">
    <div class="check" id="c-fill"><div class="label">Fill</div><div class="val">–</div></div>
    <div class="check" id="c-focus"><div class="label">Focus</div><div class="val">–</div></div>
    <div class="check" id="c-light"><div class="label">Light</div><div class="val">–</div></div>
  </div>

  <div id="status">Starting camera…</div>

  <div class="actions">
    <button id="shoot" disabled>Hold steady…</button>
    <button id="force" class="secondary">Capture anyway (override checks)</button>
  </div>
  <div id="meta"></div>

<script>
// --- Geometry, derived from physical measurements -------------------------
// Ridge-to-ridge spacing averages 0.46 mm and an adult thumb is ~20 mm wide,
// so a thumb N px wide gives a ridge period of ~N*0.023 px. Targeting ~15 px
// per ridge (the pipeline rescales to 8, so ~2x oversampled) needs ~650 px.
// Verified against our own photos: thumb_6172 is 734 px wide, 15.2 px period.
// The target is a pixel COUNT, so its share of the frame depends on the
// stream resolution and is computed per device.
// 560px -> ~12.9px ridge period, still ~1.6x oversampled before the pipeline
// rescales to 8px. Deliberately LOWER than the 650 first shipped: a phone's
// main wide lens stops focusing around 10-15cm, and a web page cannot switch
// to the ultrawide/macro camera the way the native app does. Evidence: a
// guided capture at 26.3 px/mm focused and gave 100 minutiae, while one at
// 30.2 px/mm (physically closer) could not focus and gave garbage. Asking for
// a slightly smaller thumb keeps users where the lens still works.
const TARGET_THUMB_PX = 560;
// Only the WIDTH carries the scale; crop_distal finds the pad in the full
// photo regardless, so height is pure ergonomics.
// MIN_FRAC must stay below TARGET/(widest stream) or it silently overrides the
// target on high-resolution sensors — at 3024px wide, a 0.22 floor demanded
// 665px however small the target was set.
const ASPECT = 1.45, MIN_FRAC = 0.16, MAX_FRAC = 0.72;
const MIN_FILL = 0.55, MIN_LUMA = 60, MAX_LUMA = 225, MAX_CLIP = 0.18;
// Focus is judged RELATIVE to the sharpest frame this device has produced, not
// against an absolute number. Measured values vary hugely by sensor and scene:
// a good hand-held photo scored 16.6 while a good guided capture scored 5.7 and
// a blurred one 3.2 — no fixed threshold separates those. The peak decays so
// the bar falls if you move somewhere darker.
const FOCUS_FLOOR = 3.5, FOCUS_RATIO = 0.65, PEAK_DECAY = 0.997;
const BURST = 5, BURST_MS = 110;

const $ = id => document.getElementById(id);
const video = $('v'), stage = $('stage');
const work = document.createElement('canvas');
const wctx = work.getContext('2d', {willReadFrequently:true});
let box = null, busy = false, sticky = '', mode = 'enroll', focusPeak = 0;

function say(msg, kind){          // status the tick loop will not clobber
  const el = $('status');
  el.textContent = msg;
  el.className = kind || '';
}

function show(html, kind){        // rich result (identify verdict)
  const el = $('status');
  el.innerHTML = html;
  el.className = kind || '';
}

function setMode(m){
  mode = m;
  document.querySelectorAll('.mode').forEach(b =>
    b.classList.toggle('on', b.dataset.mode === m));
  $('name').style.display = (m === 'enroll') ? '' : 'none';
  $('key').style.flex = (m === 'enroll') ? '0 0 42%' : '1';
  $('shoot').textContent = 'Hold steady…';
  sticky = '';
}

function layout(){
  const vw = video.videoWidth, vh = video.videoHeight;
  if(!vw) return;
  // Size the stage explicitly so it always fits the viewport AND keeps the
  // stream's exact aspect — the overlay's percentages then map 1:1 onto frame
  // coordinates, which the fill/focus sampling depends on.
  const maxW = document.body.clientWidth - 24;
  const maxH = Math.max(200, window.innerHeight * 0.42);
  let w = maxW, h = w * vh / vw;
  if(h > maxH){ h = maxH; w = h * vw / vh; }
  stage.style.width = Math.round(w) + 'px';
  stage.style.height = Math.round(h) + 'px';
  silhouettePath();
}

function silhouettePath(){
  const vw = video.videoWidth || 3, vh = video.videoHeight || 4;
  // The viewBox is a 0..100 square stretched over the frame, so X and Y units
  // are different physical lengths: frame-width measures need a (vw/vh) factor.
  const k = vw / vh;
  const frac = Math.min(MAX_FRAC, Math.max(MIN_FRAC, TARGET_THUMB_PX / vw));
  const w = frac * 100, h = w * ASPECT * k, ry = w * 0.62 * k;
  const x0 = 50 - w/2, x1 = 50 + w/2;
  const y0 = 50 - h/2, y1 = 50 + h/2, yArc = y0 + ry;
  const d = `M ${x0} ${y1} L ${x0} ${yArc} A ${w/2} ${ry} 0 0 1 ${x1} ${yArc} L ${x1} ${y1}`;
  $('silh').setAttribute('d', d);
  $('silh-mask').setAttribute('d', d + ' Z');
  box = {x0:x0/100, x1:x1/100, y0:y0/100, y1:y1/100};
  $('meta').textContent = `${vw}x${vh} · outline ${Math.round(frac*vw)}px `
    + `(${Math.round(frac*100)}%) · ridge ~${(frac*vw*0.023).toFixed(1)}px`
    + (window.__focusCtl ? ` · focus ${window.__focusCtl}` : '');
}

function analyse(){
  if(!video.videoWidth || !box) return null;
  const W = 160, H = Math.round(W * video.videoHeight / video.videoWidth);
  work.width = W; work.height = H;
  wctx.drawImage(video, 0, 0, W, H);
  const px0 = Math.max(0, Math.floor(box.x0*W)), px1 = Math.min(W, Math.ceil(box.x1*W));
  const py0 = Math.max(0, Math.floor(box.y0*H)), py1 = Math.min(H, Math.ceil(box.y1*H));
  if(px1 <= px0+2 || py1 <= py0+2) return null;
  const w = px1-px0, h = py1-py0;
  const d = wctx.getImageData(px0, py0, w, h).data;
  let skin=0, lum=0, clipped=0, n=0;
  const gray = new Float32Array(w*h);
  const isSkin = new Uint8Array(w*h);
  for(let i=0, p=0; p<d.length; p+=4, i++){
    const r=d[p], g=d[p+1], b=d[p+2];
    const y = 0.299*r + 0.587*g + 0.114*b;
    gray[i]=y; lum+=y; n++;
    if(y > 250) clipped++;
    const cr = 0.5*r - 0.419*g - 0.081*b + 128;   // same gate as the backend
    if(cr > 135 && cr < 185 && r > g && r > b){ skin++; isSkin[i]=1; }
  }
  // Sharpness over SKIN PIXELS ONLY. Measuring the whole outline box let a
  // sharp background (visible around the arch corners) mask a blurred thumb —
  // a field capture focused on a bathroom 3m away passed this check while the
  // thumb had no ridges at all.
  let lap=0, ln=0;
  for(let y=1; y<h-1; y++) for(let x=1; x<w-1; x++){
    const i=y*w+x;
    if(!isSkin[i]) continue;
    lap += Math.abs(4*gray[i]-gray[i-1]-gray[i+1]-gray[i-w]-gray[i+w]); ln++;
  }
  // Background sharpness, for contrast: if the surroundings are much crisper
  // than the finger, the camera has locked onto the wrong subject.
  let blap=0, bn=0;
  for(let y=1; y<h-1; y++) for(let x=1; x<w-1; x++){
    const i=y*w+x;
    if(isSkin[i]) continue;
    blap += Math.abs(4*gray[i]-gray[i-1]-gray[i+1]-gray[i-w]-gray[i+w]); bn++;
  }
  const focus = ln ? lap/ln : 0, bg = bn ? blap/bn : 0;
  return {fill: skin/n, focus, bg, lum, luma: lum/n, clip: clipped/n,
          bgSharper: bg > focus * 1.6 && bn > n*0.15};
}

function setCheck(el, ok, text){
  el.className = 'check ' + (ok ? 'pass' : 'fail');
  el.querySelector('.val').textContent = text;
}

function tick(){
  const m = analyse();
  if(m && !busy){
    focusPeak = Math.max(m.focus, focusPeak * PEAK_DECAY);
    const focusBar = Math.max(FOCUS_FLOOR, focusPeak * FOCUS_RATIO);
    // Gate on skin sharpness only. The background/skin ratio looked promising
    // but misfires: a capture that worked scored 1.61 while one that failed
    // scored 1.45, so it is shown as advice, never used to block.
    const fillOk = m.fill >= MIN_FILL;
    const focusOk = m.focus >= focusBar;
    const lightOk = m.luma>=MIN_LUMA && m.luma<=MAX_LUMA && m.clip<=MAX_CLIP;
    setCheck($('c-fill'), fillOk, Math.round(m.fill*100)+'%');
    setCheck($('c-focus'), focusOk, m.focus.toFixed(1) + ' / ' + focusPeak.toFixed(0));
    setCheck($('c-light'), lightOk, Math.round(m.luma));
    const hasName = mode === 'identify' || !!$('name').value.trim();
    $('name').className = hasName ? '' : 'missing';
    const ready = fillOk && focusOk && lightOk && hasName;
    $('shoot').disabled = !ready;
    $('shoot').textContent = ready
      ? (mode === 'enroll' ? 'Capture & enrol' : 'Identify') : 'Hold steady…';
    if(!sticky){
      say(!hasName ? 'Enter a name above to enable capture'
        : !fillOk  ? 'Move closer — fill the outline edge to edge'
        : !focusOk ? (m.bgSharper
             ? 'Background is sharper than your thumb — hold it against a close '
               + 'surface (desk, wall, your other palm) so the camera cannot '
               + 'focus past it'
             : 'Out of focus — rock the phone slowly nearer and further until '
               + 'the number peaks')
        : !lightOk ? (m.clip > MAX_CLIP ? 'Too much glare — angle away from the light'
                                        : 'Too dark — add light or use a lamp')
        : 'Looks good — hold still and capture',
        ready ? 'good' : '');
    }
  }
  requestAnimationFrame(tick);
}

let cams = [], camIdx = 0, curStream = null;

async function listCams(){
  try{
    cams = (await navigator.mediaDevices.enumerateDevices())
             .filter(d => d.kind === 'videoinput');
  }catch(e){ cams = []; }
  $('lens').textContent = cams.length > 1 ? `Lens ${camIdx+1}/${cams.length}` : 'Lens';
}

async function nextCam(){
  if(cams.length < 2) {
    say('Only one camera exposed to the browser. An ultrawide/macro lens, if '
      + 'the phone has one, may not be offered to web pages.', 'err');
    sticky='1'; setTimeout(()=>{sticky='';}, 5000); return;
  }
  camIdx = (camIdx + 1) % cams.length;
  focusPeak = 0;                       // new optics, recalibrate the focus bar
  await start(cams[camIdx].deviceId);
  await listCams();
}

async function start(deviceId){
  try{
    if(curStream) curStream.getTracks().forEach(t => t.stop());
    // A phone's macro capability usually lives on a SEPARATE camera device, so
    // enumerating and switching is the only way a web page can reach it.
    const video_c = deviceId
      ? {deviceId:{exact:deviceId}, width:{ideal:2560}, height:{ideal:1440}}
      : {facingMode:{ideal:'environment'}, width:{ideal:2560}, height:{ideal:1440}};
    const stream = await navigator.mediaDevices.getUserMedia({video: video_c});
    curStream = stream;
    const track = stream.getVideoTracks()[0];
    let focusCtl = 'auto (no control)';
    try{
      const caps = track.getCapabilities ? track.getCapabilities() : null;
      if(caps && caps.width && caps.width.max > (track.getSettings().width||0))
        await track.applyConstraints({width:{ideal:caps.width.max},
                                      height:{ideal:caps.height.max}});
      // There is no tap-to-focus in a web page. Some browsers expose focusMode
      // and pointsOfInterest through MediaTrack constraints; Safari does not.
      // Try, and report honestly what we got.
      if(caps && caps.focusMode && caps.focusMode.includes('continuous')){
        await track.applyConstraints({advanced:[{focusMode:'continuous'}]});
        focusCtl = 'continuous';
      }
      if(caps && caps.pointsOfInterest){
        await track.applyConstraints({advanced:[{pointsOfInterest:[{x:0.5,y:0.5}]}]});
        focusCtl += ' + centre POI';
      }
    }catch(e){ focusCtl = 'auto (constraint rejected)'; }
    window.__focusCtl = focusCtl;
    video.srcObject = stream;
    await video.play();
    layout();
    if(!window.__ticking){ window.__ticking = true; tick(); }  // one loop only
  }catch(e){
    say('Camera unavailable: ' + e.message
      + '\nCameras need HTTPS or localhost.', 'err');
  }
}

function grabFrame(){
  const c = document.createElement('canvas');
  c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext('2d').drawImage(video, 0, 0);
  return c;
}

function focusOf(canvas){
  // Measure sharpness ON THE CAPTURED FRAME. The live analyse() reads whatever
  // the video shows at call time, which is not necessarily the frame we just
  // grabbed — scoring the wrong frame meant "keep the sharpest" could keep a
  // blurry one.
  const W = 200, H = Math.round(W * canvas.height / canvas.width);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const cx = c.getContext('2d', {willReadFrequently:true});
  cx.drawImage(canvas, 0, 0, W, H);
  // sample the middle, where the fingertip is
  const x0 = (W*0.25)|0, y0 = (H*0.15)|0, w = (W*0.5)|0, h = (H*0.5)|0;
  const d = cx.getImageData(x0, y0, w, h).data;
  const g = new Float32Array(w*h);
  for(let i=0,p=0; p<d.length; p+=4, i++)
    g[i] = 0.299*d[p] + 0.587*d[p+1] + 0.114*d[p+2];
  let lap=0, n=0;
  for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){
    const i=y*w+x;
    lap += Math.abs(4*g[i]-g[i-1]-g[i+1]-g[i-w]-g[i+w]); n++;
  }
  return n ? lap/n : 0;
}

let lastShot = null;   // kept so a failure can be shown back to the user

async function burst(){
  const shots = [];
  for(let i=0;i<BURST;i++){
    const c = grabFrame();
    shots.push({c, f: focusOf(c)});
    say(`Capturing burst… ${i+1}/${BURST}`);
    await new Promise(r => setTimeout(r, BURST_MS));
  }
  shots.sort((a,b)=>b.f-a.f);
  lastShot = shots[0];
  return new Promise(res => shots[0].c.toBlob(b=>res(b), 'image/jpeg', 0.95));
}

const FRIENDLY = {
  QUALITY_TOO_LOW: 'Ridges too faint to read. Get closer, tap to focus, and '
    + 'add light — avoid glare straight off the skin.',
  NO_FINGER_FOUND: 'Could not find a fingertip. Fill the outline with just '
    + 'your thumb, plain background behind it.',
  GALLERY_EMPTY: 'Nobody is enrolled yet — enrol first.',
  UNREADABLE_IMAGE: 'The capture did not decode. Try again.',
  IMAGE_TOO_LARGE: 'Image too large for the server limit.',
};

function failureCard(code, detail){
  const tip = FRIENDLY[code] || detail || 'Unknown error';
  const thumb = lastShot
    ? `<img src="${lastShot.c.toDataURL('image/jpeg',0.5)}" style="width:56px;
         height:56px;object-fit:cover;border-radius:6px;flex:0 0 auto">` : '';
  return `<div style="display:flex;gap:10px;align-items:center">${thumb}`
    + `<div><span class="big">✗ ${code === 'QUALITY_TOO_LOW' ? 'Too blurry' : 'Failed'}`
    + `</span><span class="sub">${tip}</span></div></div>`;
}

async function poll(jobId, H, label){
  for(let i=0;;i++){
    await new Promise(r=>setTimeout(r, 2500));
    const j = await (await fetch(`/v1/jobs/${jobId}`, {headers:H})).json();
    if(j.status === 'succeeded') return j.result;
    if(j.status === 'failed'){
      const e = new Error(j.error?.detail || 'job failed');
      e.code = j.error?.reason_code; throw e;
    }
    say(`${label}… ${(i*2.5+2.5)|0}s (takes 10–60s)`);
  }
}

async function capture(){
  if(busy) return;
  const name = $('name').value.trim(), key = $('key').value.trim();
  if(mode === 'enroll' && !name){
    sticky='1'; say('Enter a name first, then capture.', 'err');
    setTimeout(()=>{sticky='';}, 2500); return;
  }
  if(key) localStorage.setItem('fp_key', key);
  busy = true; sticky = '1';
  $('shoot').disabled = true; $('force').disabled = true;
  $('shoot').textContent = 'Working…';
  const H = {'X-API-Key': key};
  try{
    say('Capturing burst…');
    const blob = await burst();
    const fd = new FormData();

    if(mode === 'identify'){
      fd.append('file', blob, 'probe.jpg');
      say(`Captured ${(blob.size/1024)|0} KB. Searching…`);
      const r = await fetch('/v1/identify', {method:'POST', headers:H, body:fd});
      if(r.status === 401) throw new Error('auth failed — check the API key');
      if(!r.ok) throw new Error(((await r.json()).detail) || ('HTTP '+r.status));
      const res = await poll((await r.json()).job_id, H, 'Matching');
      const runner = res.scores[1];
      const sub = (runner ? `next closest ${runner.name} at ${runner.score}` : 'only one enrolled')
                  + ` · threshold ${res.threshold}`;
      if(res.match)
        show(`<div><span class="big">✓ ${res.match.name}</span>`
           + `<span class="sub">score ${res.match.score} — ${sub}</span></div>`, 'good');
      else
        show(`<div><span class="big">No match</span><span class="sub">`
           + `closest ${res.best_candidate.name} at ${res.best_candidate.score}, `
           + `below threshold ${res.threshold}</span></div>`, 'err');
      return;
    }

    // enroll
    say(`Captured ${(blob.size/1024)|0} KB. Creating identity…`);
    let uuid, r = await fetch('/v1/identities', {
      method:'POST', headers:{...H,'Content-Type':'application/json'},
      body: JSON.stringify({name, consent:true})});
    if(r.status === 409){
      const list = await fetch('/v1/identities', {headers:H});
      if(!list.ok) throw new Error('auth failed (check the API key)');
      uuid = (await list.json()).find(i => i.name === name).uuid;
      say('Adding to existing identity…');
    }else if(r.status === 401){
      throw new Error('auth failed — check the API key');
    }else if(!r.ok){
      throw new Error(((await r.json()).detail) || ('HTTP '+r.status));
    }else{ uuid = (await r.json()).uuid; }

    fd.append('files', blob, 'capture.jpg');
    fd.append('finger', 'right_thumb');
    say('Uploading…');
    r = await fetch(`/v1/identities/${uuid}/photos`, {method:'POST', headers:H, body:fd});
    if(!r.ok) throw new Error(((await r.json()).detail) || ('HTTP '+r.status));
    const res = await poll((await r.json()).job_id, H, 'Extracting template');
    const p = res.results[0];
    if(p.status !== 'enrolled')
      { show(failureCard(p.reason_code, p.detail), 'err'); return; }
    const info = await (await fetch(`/v1/identities/${uuid}`, {headers:H})).json();
    show(`<div><span class="big">✓ ${name} — ${info.photos} photo`
       + `${info.photos===1?'':'s'}</span><span class="sub">`
       + `${p.templates} templates, ${p.minutiae} minutiae this shot · `
       + `${info.templates} total. ${info.photos < 3
            ? 'Capture ' + (3-info.photos) + ' more for a solid identity.'
            : 'Ready — switch to Identify.'}</span></div>`, 'good');
  }catch(e){
    show(e.code ? failureCard(e.code, e.message)
       : `<div><span class="big">✗ Error</span><span class="sub">${e.message}</span></div>`,
       'err');
  }finally{
    busy = false; $('force').disabled = false;
    setTimeout(()=>{ sticky=''; }, 8000);
  }
}

$('shoot').addEventListener('click', capture);
$('force').addEventListener('click', capture);
$('name').addEventListener('input', ()=>{ sticky=''; });
document.querySelectorAll('.mode[data-mode]').forEach(b =>
  b.addEventListener('click', () => setMode(b.dataset.mode)));
$('lens').addEventListener('click', nextCam);
$('key').value = localStorage.getItem('fp_key') || '';   // survive reloads
setMode('enroll');
video.addEventListener('loadedmetadata', layout);
addEventListener('resize', layout);
addEventListener('orientationchange', ()=>setTimeout(layout, 300));
start().then(listCams);
</script>
</body>
</html>
