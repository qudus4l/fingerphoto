<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fingerphoto Capture</title>
<style>
  :root{
    --bg:#0d1013; --panel:#161b21; --line:#232b34; --text:#e8edf2;
    --muted:#8b97a5; --ok:#3ddc97; --bad:#ef5f6b; --accent:#5aa9ff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       -webkit-font-smoothing:antialiased;
       display:flex;flex-direction:column;
       padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
       overflow:hidden}
  .row{display:flex;gap:8px;padding-top:10px;flex:0 0 auto}
  input{flex:1;min-width:0;padding:9px 10px;border-radius:8px;
        border:1px solid var(--line);background:var(--panel);color:var(--text);
        font-size:15px}
  input.missing{border-color:var(--bad)}
  #stage{position:relative;background:#000;border-radius:12px;overflow:hidden;
         border:1px solid var(--line);margin:10px auto 0;flex:0 0 auto}
  video{display:block;width:100%;height:100%;object-fit:cover}
  #overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .checks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
          margin-top:10px;flex:0 0 auto}
  .check{background:var(--panel);border:1px solid var(--line);border-radius:9px;
         padding:7px 9px}
  .check .label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;
                color:var(--muted)}
  .check .val{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
  .check.pass{border-color:rgba(61,220,151,.5)} .check.pass .val{color:var(--ok)}
  .check.fail .val{color:var(--bad)}
  #status{margin-top:9px;padding:9px 11px;border-radius:9px;background:var(--panel);
          border:1px solid var(--line);font-size:14px;min-height:40px;
          display:flex;align-items:center;flex:1 1 auto;overflow-y:auto;
          white-space:pre-wrap;color:var(--muted)}
  #status.err{border-color:var(--bad);color:#ffc4c9}
  #status.good{border-color:rgba(61,220,151,.5);color:var(--ok)}
  .actions{padding:9px 0 4px;flex:0 0 auto}
  button{width:100%;padding:14px;border-radius:10px;border:0;font-size:17px;
         font-weight:600;background:var(--accent);color:#08131f}
  button:disabled{background:#26303b;color:#5d6875}
  button.secondary{background:transparent;color:var(--muted);
                   border:1px solid var(--line);margin-top:7px;font-size:14px;
                   font-weight:500;padding:10px}
  #meta{font-size:11px;color:#5d6875;text-align:center;padding-bottom:6px;
        flex:0 0 auto;font-family:ui-monospace,Menlo,monospace}
</style>
</head>
<body>
  <div class="row">
    <input id="name" placeholder="Name" autocomplete="off" autocapitalize="words">
    <input id="key" placeholder="API key" type="password" autocomplete="off"
           style="flex:0 0 42%">
  </div>

  <div id="stage">
    <video id="v" playsinline muted autoplay></video>
    <svg id="overlay" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs><mask id="cut">
        <rect width="100" height="100" fill="#fff"/>
        <path id="silh-mask" fill="#000"/>
      </mask></defs>
      <rect width="100" height="100" fill="rgba(0,0,0,.5)" mask="url(#cut)"/>
      <path id="silh" fill="none" stroke="#5aa9ff" stroke-width="2.5"
            vector-effect="non-scaling-stroke"/>
    </svg>
  </div>

  <div class="checks">
    <div class="check" id="c-fill"><div class="label">Fill</div><div class="val">–</div></div>
    <div class="check" id="c-focus"><div class="label">Focus</div><div class="val">–</div></div>
    <div class="check" id="c-light"><div class="label">Light</div><div class="val">–</div></div>
  </div>

  <div id="status">Starting camera…</div>

  <div class="actions">
    <button id="shoot" disabled>Hold steady…</button>
    <button id="force" class="secondary">Capture anyway (override checks)</button>
  </div>
  <div id="meta"></div>

<script>
// --- Geometry, derived from physical measurements -------------------------
// Ridge-to-ridge spacing averages 0.46 mm and an adult thumb is ~20 mm wide,
// so a thumb N px wide gives a ridge period of ~N*0.023 px. Targeting ~15 px
// per ridge (the pipeline rescales to 8, so ~2x oversampled) needs ~650 px.
// Verified against our own photos: thumb_6172 is 734 px wide, 15.2 px period.
// The target is a pixel COUNT, so its share of the frame depends on the
// stream resolution and is computed per device.
const TARGET_THUMB_PX = 650;
// Only the WIDTH carries the scale; crop_distal finds the pad in the full
// photo regardless, so height is pure ergonomics.
const ASPECT = 1.45, MIN_FRAC = 0.22, MAX_FRAC = 0.72;
const MIN_FILL = 0.55, MIN_FOCUS = 12, MIN_LUMA = 60, MAX_LUMA = 225, MAX_CLIP = 0.18;
const BURST = 5, BURST_MS = 110;

const $ = id => document.getElementById(id);
const video = $('v'), stage = $('stage');
const work = document.createElement('canvas');
const wctx = work.getContext('2d', {willReadFrequently:true});
let box = null, busy = false, sticky = '';

function say(msg, kind){          // status the tick loop will not clobber
  const el = $('status');
  el.textContent = msg;
  el.className = kind || '';
}

function layout(){
  const vw = video.videoWidth, vh = video.videoHeight;
  if(!vw) return;
  // Size the stage explicitly so it always fits the viewport AND keeps the
  // stream's exact aspect — the overlay's percentages then map 1:1 onto frame
  // coordinates, which the fill/focus sampling depends on.
  const maxW = document.body.clientWidth - 24;
  const maxH = Math.max(200, window.innerHeight * 0.42);
  let w = maxW, h = w * vh / vw;
  if(h > maxH){ h = maxH; w = h * vw / vh; }
  stage.style.width = Math.round(w) + 'px';
  stage.style.height = Math.round(h) + 'px';
  silhouettePath();
}

function silhouettePath(){
  const vw = video.videoWidth || 3, vh = video.videoHeight || 4;
  // The viewBox is a 0..100 square stretched over the frame, so X and Y units
  // are different physical lengths: frame-width measures need a (vw/vh) factor.
  const k = vw / vh;
  const frac = Math.min(MAX_FRAC, Math.max(MIN_FRAC, TARGET_THUMB_PX / vw));
  const w = frac * 100, h = w * ASPECT * k, ry = w * 0.62 * k;
  const x0 = 50 - w/2, x1 = 50 + w/2;
  const y0 = 50 - h/2, y1 = 50 + h/2, yArc = y0 + ry;
  const d = `M ${x0} ${y1} L ${x0} ${yArc} A ${w/2} ${ry} 0 0 1 ${x1} ${yArc} L ${x1} ${y1}`;
  $('silh').setAttribute('d', d);
  $('silh-mask').setAttribute('d', d + ' Z');
  box = {x0:x0/100, x1:x1/100, y0:y0/100, y1:y1/100};
  $('meta').textContent = `${vw}x${vh} · outline ${Math.round(frac*vw)}px `
    + `(${Math.round(frac*100)}%) · ridge ~${(frac*vw*0.023).toFixed(1)}px`;
}

function analyse(){
  if(!video.videoWidth || !box) return null;
  const W = 160, H = Math.round(W * video.videoHeight / video.videoWidth);
  work.width = W; work.height = H;
  wctx.drawImage(video, 0, 0, W, H);
  const px0 = Math.max(0, Math.floor(box.x0*W)), px1 = Math.min(W, Math.ceil(box.x1*W));
  const py0 = Math.max(0, Math.floor(box.y0*H)), py1 = Math.min(H, Math.ceil(box.y1*H));
  if(px1 <= px0+2 || py1 <= py0+2) return null;
  const w = px1-px0, h = py1-py0;
  const d = wctx.getImageData(px0, py0, w, h).data;
  let skin=0, lum=0, clipped=0, n=0;
  const gray = new Float32Array(w*h);
  for(let i=0, p=0; p<d.length; p+=4, i++){
    const r=d[p], g=d[p+1], b=d[p+2];
    const y = 0.299*r + 0.587*g + 0.114*b;
    gray[i]=y; lum+=y; n++;
    if(y > 250) clipped++;
    const cr = 0.5*r - 0.419*g - 0.081*b + 128;   // same gate as the backend
    if(cr > 135 && cr < 185 && r > g && r > b) skin++;
  }
  let lap=0, ln=0;
  for(let y=1; y<h-1; y++) for(let x=1; x<w-1; x++){
    const i=y*w+x;
    lap += Math.abs(4*gray[i]-gray[i-1]-gray[i+1]-gray[i-w]-gray[i+w]); ln++;
  }
  return {fill: skin/n, focus: ln?lap/ln:0, luma: lum/n, clip: clipped/n};
}

function setCheck(el, ok, text){
  el.className = 'check ' + (ok ? 'pass' : 'fail');
  el.querySelector('.val').textContent = text;
}

function tick(){
  const m = analyse();
  if(m && !busy){
    const fillOk = m.fill >= MIN_FILL, focusOk = m.focus >= MIN_FOCUS;
    const lightOk = m.luma>=MIN_LUMA && m.luma<=MAX_LUMA && m.clip<=MAX_CLIP;
    setCheck($('c-fill'), fillOk, Math.round(m.fill*100)+'%');
    setCheck($('c-focus'), focusOk, m.focus.toFixed(0));
    setCheck($('c-light'), lightOk, Math.round(m.luma));
    const hasName = !!$('name').value.trim();
    $('name').className = hasName ? '' : 'missing';
    const ready = fillOk && focusOk && lightOk && hasName;
    $('shoot').disabled = !ready;
    $('shoot').textContent = ready ? 'Capture' : 'Hold steady…';
    if(!sticky){
      say(!hasName ? 'Enter a name above to enable capture'
        : !fillOk  ? 'Move closer — fill the outline edge to edge'
        : !focusOk ? 'Tap the screen on your thumb to focus'
        : !lightOk ? (m.clip > MAX_CLIP ? 'Too much glare — angle away from the light'
                                        : 'Too dark — add light or use a lamp')
        : 'Looks good — hold still and capture',
        ready ? 'good' : '');
    }
  }
  requestAnimationFrame(tick);
}

async function start(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'}, width:{ideal:2560}, height:{ideal:1440}}
    });
    const track = stream.getVideoTracks()[0];
    try{
      const caps = track.getCapabilities ? track.getCapabilities() : null;
      if(caps && caps.width && caps.width.max > (track.getSettings().width||0))
        await track.applyConstraints({width:{ideal:caps.width.max},
                                      height:{ideal:caps.height.max}});
    }catch(e){}
    video.srcObject = stream;
    await video.play();
    layout(); tick();
  }catch(e){
    say('Camera unavailable: ' + e.message
      + '\nCameras need HTTPS or localhost.', 'err');
  }
}

function grabFrame(){
  const c = document.createElement('canvas');
  c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext('2d').drawImage(video, 0, 0);
  return c;
}

async function burst(){
  const shots = [];
  for(let i=0;i<BURST;i++){
    shots.push({c: grabFrame(), f: (analyse()||{focus:0}).focus});
    await new Promise(r => setTimeout(r, BURST_MS));
  }
  shots.sort((a,b)=>b.f-a.f);
  return new Promise(res => shots[0].c.toBlob(b=>res(b), 'image/jpeg', 0.95));
}

async function capture(){
  if(busy) return;
  const name = $('name').value.trim(), key = $('key').value.trim();
  if(!name){ sticky='1'; say('Enter a name first, then capture.', 'err');
             setTimeout(()=>{sticky='';}, 2500); return; }
  busy = true; sticky = '1';
  $('shoot').disabled = true; $('force').disabled = true;
  $('shoot').textContent = 'Working…';
  try{
    say('Capturing burst…');
    const blob = await burst();
    say(`Captured ${(blob.size/1024).toFixed(0)} KB. Creating identity…`);
    const H = {'X-API-Key': key};
    let uuid, r = await fetch('/v1/identities', {
      method:'POST', headers:{...H,'Content-Type':'application/json'},
      body: JSON.stringify({name, consent:true})});
    if(r.status === 409){
      const list = await fetch('/v1/identities', {headers:H});
      if(!list.ok) throw new Error('auth failed (check the API key)');
      uuid = (await list.json()).find(i => i.name === name).uuid;
      say('Adding to existing identity…');
    }else if(r.status === 401){
      throw new Error('auth failed — check the API key');
    }else if(!r.ok){
      throw new Error(((await r.json()).detail) || ('HTTP '+r.status));
    }else{ uuid = (await r.json()).uuid; }

    const fd = new FormData();
    fd.append('files', blob, 'capture.jpg');
    fd.append('finger', 'right_thumb');
    say('Uploading…');
    r = await fetch(`/v1/identities/${uuid}/photos`, {method:'POST', headers:H, body:fd});
    if(!r.ok) throw new Error(((await r.json()).detail) || ('HTTP '+r.status));
    const {job_id} = await r.json();

    for(let i=0;;i++){
      await new Promise(r=>setTimeout(r, 2500));
      const j = await (await fetch(`/v1/jobs/${job_id}`, {headers:H})).json();
      if(j.status === 'succeeded'){
        const p = j.result.results[0];
        say(p.status === 'enrolled'
          ? `✓ Enrolled — ${p.templates} templates, ${p.minutiae} minutiae.\n`
            + `Capture 2–3 shots per person.`
          : `✗ Rejected: ${p.reason_code}\n${p.detail}`,
          p.status === 'enrolled' ? 'good' : 'err');
        break;
      }
      if(j.status === 'failed'){
        say('✗ Failed: ' + (j.error?.reason_code||'unknown'), 'err'); break;
      }
      say(`Extracting template… ${i*2.5+2.5|0}s (takes 10–60s)`);
    }
  }catch(e){
    say('✗ ' + e.message, 'err');
  }finally{
    busy = false; $('force').disabled = false;
    setTimeout(()=>{ sticky=''; }, 6000);
  }
}

$('shoot').addEventListener('click', capture);
$('force').addEventListener('click', capture);
$('name').addEventListener('input', ()=>{ sticky=''; });
video.addEventListener('loadedmetadata', layout);
addEventListener('resize', layout);
addEventListener('orientationchange', ()=>setTimeout(layout, 300));
start();
</script>
</body>
</html>
